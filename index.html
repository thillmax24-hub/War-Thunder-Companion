<!-- WT BR FILTER -->
<style>
.wt-br-controls {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.wt-br-controls label {
  font-size: 13px;
  color: var(--muted);
}

.wt-br-controls select {
  margin-top: 6px;
}

.wt-br-note {
  grid-column: 1 / -1;
  font-size: 12px;
  margin: 0;
}

.wt-br-reset {
  grid-column: 1 / -1;
}
</style>

<script>
(() => {
  if (window.wtBRControls) return;
  window.wtBRControls = true;

  const root = document.getElementById('content');
  if (!root) return;

  const t = (de, en) =>
    document.documentElement.lang === 'en' ? en : de;

  function read(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  }

  const saved = read('wt-br-range-v1', {});

  const valid = value =>
    typeof value === 'number' &&
    Number.isFinite(value) &&
    value >= 0;

  let minimum = valid(saved?.minimum)
    ? saved.minimum
    : null;

  let maximum = valid(saved?.maximum)
    ? saved.maximum
    : null;

  if (
    minimum !== null &&
    maximum !== null &&
    minimum > maximum
  ) {
    maximum = minimum;
  }

  window.wtBRFilter = (vehicle, mode) => {
    if (minimum === null && maximum === null) {
      return true;
    }

    const value = vehicle[mode];

    return valid(value) &&
      (minimum === null || value >= minimum) &&
      (maximum === null || value <= maximum);
  };

  function save() {
    try {
      localStorage.setItem(
        'wt-br-range-v1',
        JSON.stringify({ minimum, maximum })
      );
    } catch {}
  }

  function apply() {
    save();
    refresh();

    root.querySelector('#catalog-search')?.dispatchEvent(
      new Event('input', { bubbles: true })
    );
  }

  let lastMarkup = '';

  function refresh() {
    const filters = root.querySelector('.catalog-filters');
    if (!filters) return;

    let controls = filters.querySelector('.wt-br-controls');

    if (!controls) {
      controls = document.createElement('div');
      controls.className = 'wt-br-controls';
      filters.append(controls);
      lastMarkup = '';
    }

    const mode =
      root.querySelector('#choose-mode')?.value || 'rb';

    const values = [];

    const countries = [
      'germany',
      'usa',
      'britain',
      'ussr',
      'france',
      'italy',
      'japan',
      'china',
      'sweden',
      'israel'
    ];

    for (const country of countries) {
      const data = read('wt-country-v1-' + country, null);

      if (Array.isArray(data?.items)) {
        data.items.forEach(vehicle => {
          if (valid(vehicle[mode])) {
            values.push(vehicle[mode]);
          }
        });
      }
    }

    const snapshots = read('wt-snapshots', {});

    if (snapshots && typeof snapshots === 'object') {
      Object.values(snapshots).forEach(vehicle => {
        if (vehicle && valid(vehicle[mode])) {
          values.push(vehicle[mode]);
        }
      });
    }

    if (minimum !== null) values.push(minimum);
    if (maximum !== null) values.push(maximum);

    const ratings = [...new Set(values)].sort(
      (a, b) => a - b
    );

    const options = selected =>
      `<option value="all">${t('Beliebig', 'Any')}</option>` +
      ratings.map(value => `
        <option
          value="${value}"
          ${value === selected ? 'selected' : ''}
        >
          ${value.toFixed(1)}
        </option>
      `).join('');

    const markup = `
      <label>
        ${t('BR-Minimum', 'Minimum BR')}

        <select
          id="wt-br-minimum"
          aria-label="${t('BR-Minimum', 'Minimum BR')}"
        >
          ${options(minimum)}
        </select>
      </label>

      <label>
        ${t('BR-Maximum', 'Maximum BR')}

        <select
          id="wt-br-maximum"
          aria-label="${t('BR-Maximum', 'Maximum BR')}"
        >
          ${options(maximum)}
        </select>
      </label>

      <p class="wt-br-note">
        ${t(
          'Filter für den gewählten Spielmodus. Bei aktivem BR-Filter werden Fahrzeuge ohne BR-Wert ausgeblendet.',
          'Filter for the selected game mode. Vehicles without a BR value are hidden when a BR filter is active.'
        )}
      </p>

      <button class="wt-br-reset" id="wt-br-reset">
        ${t('BR-Filter zurücksetzen', 'Reset BR filter')}
      </button>
    `;

    if (markup === lastMarkup) return;

    lastMarkup = markup;
    controls.innerHTML = markup;

    controls.querySelector('#wt-br-minimum')
      .addEventListener('change', event => {
        minimum = event.target.value === 'all'
          ? null
          : Number(event.target.value);

        if (
          minimum !== null &&
          maximum !== null &&
          minimum > maximum
        ) {
          maximum = minimum;
        }

        apply();
      });

    controls.querySelector('#wt-br-maximum')
      .addEventListener('change', event => {
        maximum = event.target.value === 'all'
          ? null
          : Number(event.target.value);

        if (
          maximum !== null &&
          minimum !== null &&
          maximum < minimum
        ) {
          minimum = maximum;
        }

        apply();
      });

    controls.querySelector('#wt-br-reset')
      .addEventListener('click', () => {
        minimum = null;
        maximum = null;
        apply();
      });
  }

  new MutationObserver(refresh).observe(root, {
    childList: true,
    subtree: true
  });

  new MutationObserver(refresh).observe(
    document.documentElement,
    {
      attributes: true,
      attributeFilter: ['lang']
    }
  );

  refresh();
})();
</script>
<!-- /WT BR FILTER -->
