<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WT Companion">
<title>WT Companion • Military Tactical</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

<style>
:root{color-scheme:dark;--bg:#101510;--panel:#1a231b;--line:#354135;--gold:#dfb968;--text:#eef1e9;--muted:#b5c0af}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
button,input,select{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
button,select,input{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);min-height:46px;padding:11px 14px}
button{cursor:pointer}
button:hover{border-color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{border-bottom:1px solid var(--line);background:#141b15;padding:18px max(18px,env(safe-area-inset-left))}
.top{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:1px}
.brand span{color:var(--gold)}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:5px}
main{max-width:1000px;margin:auto;padding:24px 18px calc(110px + env(safe-area-inset-bottom))}
.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;font-weight:800}
.hero{border:1px solid var(--line);border-radius:20px;padding:26px;background:radial-gradient(ellipse at top right,#394b2d,transparent 70%),repeating-linear-gradient(135deg,transparent 0 22px,#ffffff03 22px 23px),var(--panel)}
h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:15px 0}
h2{font-size:22px;margin:24px 0 14px}
p{color:var(--muted);line-height:1.6}
.hero p{max-width:530px}
.gold{background:var(--gold);color:#151a12;font-weight:800;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card,.notice{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px}
input,select{width:100%;min-width:0}
.card{position:relative}
.card h3{font-size:19px;margin:14px 0 8px}
.badge{display:inline-block;color:var(--gold);font-size:11px;letter-spacing:1px;border:1px solid var(--line);padding:5px 8px;border-radius:6px}
.symbol{font-size:30px;margin-top:14px;color:var(--muted)}
.card p{font-size:13px;margin:8px 0 18px}
.actions{display:flex;align-items:center;gap:10px;justify-content:space-between}
.link{color:var(--gold);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;min-height:44px}
.star{font-size:23px;padding:5px 13px;color:var(--gold)}
.star[aria-pressed="true"]{background:#dfb96820;border-color:var(--gold)}
.notice{font-size:13px;color:var(--muted);line-height:1.6;margin-top:18px}
.empty{grid-column:1 / -1;text-align:center;padding:30px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#141b15f5;border-top:1px solid var(--line);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px;backdrop-filter:blur(12px);z-index:5}
nav button{border:0;background:transparent;flex:1;max-width:170px;padding:8px 4px;font-size:11px;color:var(--muted)}
nav button span{display:block;font-size:21px;margin-bottom:4px}
nav button[aria-current="page"]{background:#dfb96815;color:var(--gold)}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:32px;line-height:1.7}
#status{color:var(--gold);font-size:13px}
#status:empty{display:none}
#vehicle-detail{width:min(560px,calc(100% - 28px));max-height:85dvh;overflow-y:auto;border:1px solid var(--gold);border-radius:20px;padding:24px;background:var(--panel);color:var(--text)}
#vehicle-detail::backdrop{background:#000b}
#vehicle-detail h2{margin:16px 0}
#vehicle-detail table{width:100%;border-collapse:collapse}
#vehicle-detail th,#vehicle-detail td{padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
#vehicle-detail th{color:var(--muted);font-weight:500}
#vehicle-detail td{text-align:right;overflow-wrap:anywhere}
.detail-button{width:100%;margin-top:14px}
.nation-card{text-align:left}
.nation-card strong{display:block;font-size:21px;margin:12px 0}
.nation-card span{font-size:12px;color:var(--muted)}
.catalog-filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.catalog-filters input{grid-column:1 / -1}
.catalog-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.catalog-bar button{margin-top:12px}
#catalog-results{font-size:13px;color:var(--muted)}
.catalog-br{color:var(--gold);font-size:20px;font-weight:800}
.catalog-card h3{overflow-wrap:anywhere}
button:disabled{opacity:.45;cursor:default}

.wt-photo{position:relative;display:grid;place-items:center;height:170px;margin:16px 0;overflow:hidden;border:1px solid #344437;border-radius:12px;background:radial-gradient(ellipse at center,#2b3a2e,#101710)}
.wt-photo img{width:100%;height:100%;object-fit:contain;padding:12px;opacity:0;transition:opacity .2s}
.wt-photo.ready img{opacity:1}
.wt-photo span{position:absolute;padding:12px;color:#abb8a9;font-size:13px;text-align:center}
.wt-photo.ready span{display:none}
.wt-photo.failed img{display:none}
#vehicle-detail .wt-photo{height:240px}

.wt-compare-panel{margin:18px 0;padding:16px;border:1px solid #344437;border-radius:14px;background:#172019}
.wt-compare-panel h2{margin:0 0 10px;font-size:20px}
.wt-compare-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wt-compare-message{color:#abb8a9;font-size:13px}
.wt-compare-pick{width:100%;margin-top:8px}
.wt-compare-pick[aria-pressed="true"]{border-color:#dfb968;color:#dfb968;background:#dfb96820}
#wt-compare-dialog{width:min(760px,95vw);max-height:88vh;overflow:auto;border:1px solid #344437;border-radius:16px;padding:20px;background:#172019;color:#edf2e9}
#wt-compare-dialog::backdrop{background:#000b}
.wt-compare-scroll{overflow-x:auto}
#wt-compare-dialog table{width:100%;min-width:440px;border-collapse:collapse;table-layout:fixed}
#wt-compare-dialog th,#wt-compare-dialog td{padding:12px 8px;border-bottom:1px solid #344437;vertical-align:top;text-align:left;overflow-wrap:anywhere}
#wt-compare-dialog thead th{color:#dfb968}
#wt-compare-dialog tbody th{color:#abb8a9;font-weight:500}

.wt-lineup-pick{width:100%;margin-top:8px}
.wt-lineup-pick[aria-pressed="true"]{border-color:#dfb968;color:#dfb968}
#wt-lineup-dialog{width:min(680px,95vw);max-height:88dvh;overflow:auto;padding:20px;border:1px solid #dfb968;border-radius:18px;background:#172019;color:#edf2e9}
#wt-lineup-dialog::backdrop{background:#000b}
.wt-lineup-controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.wt-lineup-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wt-lineup-fields label{font-size:13px;color:#abb8a9}
.wt-lineup-fields input,.wt-lineup-fields select{margin-top:6px}
.wt-lineup-slot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #344437}
.wt-lineup-slot small{display:block;color:#abb8a9;margin-top:5px}
.wt-lineup-result{padding:16px;margin:16px 0;border:1px solid #344437;border-radius:12px;color:#dfb968;font-size:22px;font-weight:800}
#wt-lineup-message{color:#dfb968;font-size:13px}

.wt-br-controls{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wt-br-controls label{font-size:13px;color:var(--muted)}
.wt-br-controls select{margin-top:6px}
.wt-br-note{grid-column:1 / -1;font-size:12px;margin:0}
.wt-br-reset{grid-column:1 / -1}

.wt-account-button{margin-left:8px;color:var(--gold)}
.wt-progress-box{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.wt-progress-box p{margin:6px 0;font-size:13px}
.wt-progress-select{margin-top:8px}
.wt-progress-select label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
#wt-account-dialog{width:min(600px,calc(100% - 24px));max-height:88dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:18px;padding:20px}
#wt-account-dialog::backdrop{background:#000b}
#wt-account-dialog label{display:block;margin:12px 0;font-size:13px;color:var(--muted)}
#wt-account-dialog input{margin-top:6px}
.wt-account-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
#wt-account-message{color:var(--gold);font-size:13px}
.wt-progress-nation{border-bottom:1px solid var(--line);padding:12px 0}

@media(max-width:700px){
.grid{grid-template-columns:repeat(2,1fr)}
.hero{padding:22px}
.brand{font-size:14px}
}
@media(max-width:420px){
.grid{grid-template-columns:1fr}
.wt-lineup-fields{grid-template-columns:1fr}
}
</style>
</head>

<body>
<header>
  <div class="top">
    <div class="brand">
      <span>WT</span> COMPANION
      <small>MILITARY TACTICAL</small>
    </div>
    <button id="language" aria-label="Switch to English">EN</button>
  </div>
</header>

<main>
  <div id="content"></div>
  <p id="status" role="status"></p>
  <footer id="footer"></footer>
</main>

<nav id="navigation" aria-label="Navigation"></nav>
<dialog id="vehicle-detail" aria-labelledby="detail-title"></dialog>

<!-- KATALOG -->
<script>
"use strict";
let lang="de";
try{
  lang=localStorage.getItem("wt-language")==="en"?"en":"de";
}catch{}

const vehicles=[
{id:"bf109",name:"Bf 109 E-3",nation:"de",type:"air"},
{id:"fw190",name:"Fw 190 A-1",nation:"de",type:"air"},
{id:"p51",name:"P-51D-5",nation:"us",type:"air"},
{id:"p47",name:"P-47D-28",nation:"us",type:"air"},
{id:"spitfire",name:"Spitfire Mk Ia",nation:"gb",type:"air"},
{id:"yak",name:"Yak-1",nation:"su",type:"air"},
{id:"tiger",name:"Tiger H1",nation:"de",type:"ground"},
{id:"panther",name:"Panther D",nation:"de",type:"ground"},
{id:"sherman",name:"M4A1",nation:"us",type:"ground"},
{id:"chaffee",name:"M24",nation:"us",type:"ground"},
{id:"cromwell",name:"Cromwell V",nation:"gb",type:"ground"},
{id:"t34",name:"T-34 (1942)",nation:"su",type:"ground"}
];

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));
}

(()=>{
const API="https://wtvehiclesapi.duckdns.org/api/vehicles";
const TTL=86400000;
const countries={
germany:["Deutschland","Germany","🇩🇪"],
usa:["USA","USA","🇺🇸"],
britain:["Großbritannien","Great Britain","🇬🇧"],
ussr:["UdSSR","USSR","★"],
france:["Frankreich","France","🇫🇷"],
italy:["Italien","Italy","🇮🇹"],
japan:["Japan","Japan","🇯🇵"],
china:["China","China","🇨🇳"],
sweden:["Schweden","Sweden","🇸🇪"],
israel:["Israel","Israel","🇮🇱"]
};
const categories={
all:["Alle Fahrzeuge","All vehicles"],
air:["Flugzeuge","Aircraft"],
heli:["Hubschrauber","Helicopters"],
ground:["Bodenfahrzeuge","Ground vehicles"],
blue:["Hochseeflotte","Bluewater fleet"],
coast:["Küstenflotte","Coastal fleet"],
other:["Weitere Typen","Other types"]
};
const legacy={
bf109:"bf-109e-3",fw190:"fw-190a-1",
p51:"p-51d-5",p47:"p-47d-28",
spitfire:"spitfire_mk1",yak:"yak-1_early",
tiger:"germ_pzkpfw_VI_ausf_h1_tiger",
panther:"germ_pzkpfw_V_ausf_d_panther",
sherman:"us_m4a1_1942_sherman",
chaffee:"us_m24_chaffee",
cromwell:"uk_a27m_cromwell_5",
t34:"ussr_t_34_1942"
};

const t=(de,en)=>lang==="de"?de:en;
const countryName=id=>countries[id]?.[lang==="de"?0:1]||id;
const categoryName=id=>categories[id][lang==="de"?0:1];
const esc=escapeHTML;

function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))??fallback}
catch{return fallback}
}
let storageFailed=false;
function write(key,value){
try{localStorage.setItem(key,JSON.stringify(value))}
catch{storageFailed=true}
}

const oldFavorites=read("wt-favorites",[]);
const favorites=new Set(
Array.isArray(oldFavorites)?
oldFavorites.filter(id=>typeof id==="string").map(id=>legacy[id]||id):[]
);
let snapshots=read("wt-snapshots",{});
if(!snapshots||Array.isArray(snapshots)||typeof snapshots!=="object"){
snapshots={};
}

vehicles.forEach(vehicle=>{
const id=legacy[vehicle.id];
if(id&&favorites.has(id)&&!snapshots[id]){
snapshots[id]={
id,
country:{de:"germany",us:"usa",gb:"britain",su:"ussr"}[vehicle.nation],
category:vehicle.type,
name:vehicle.name,
rank:null,ab:null,rb:null,sb:null
};
}
});
write("wt-favorites",[...favorites]);
write("wt-snapshots",snapshots);

let page="nations",country="germany",category="all";
let search="",rank="all",mode="rb",shown=60;
let loading=false,error="",retrieved=0,list=[],detailRequest=0;
const memory={},pending={},names={};
const root=document.getElementById("content");
const detail=document.getElementById("vehicle-detail");

function classify(type){
if(["fighter","assault","bomber"].includes(type))return "air";
if(["attack_helicopter","utility_helicopter"].includes(type))return "heli";
if(["tank","light_tank","medium_tank","heavy_tank","tank_destroyer","spaa","lbv","mbv","hbv","exoskeleton"].includes(type))return "ground";
if(["destroyer","light_cruiser","heavy_cruiser","battlecruiser","battleship","ship"].includes(type))return "blue";
if(["boat","heavy_boat","barge","frigate"].includes(type))return "coast";
return "other";
}
function normalize(v){
return{
id:v.identifier,country:v.country,category:classify(v.vehicle_type),
rank:v.era,ab:v.arcade_br,rb:v.realistic_br,sb:v.simulator_br,
grb:v.realistic_ground_br,gsb:v.simulator_ground_br,
premium:Boolean(v.is_premium||v.is_pack),event:Boolean(v.event),
crew:v.crew_total_count,hull:v.hull_armor,turret:v.turret_armor
};
}
function name(v){
const key=v.id.toLowerCase()+"_short";
return names[lang]?.vehicles?.[key]||
names.en?.vehicles?.[key]||v.name||v.id;
}
const formatBR=value=>
typeof value==="number"&&Number.isFinite(value)?value.toFixed(1):"—";
const wiki=v=>"https://wiki.warthunder.com/unit/"+encodeURIComponent(v.id);

async function fetchJSON(url){
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),25000);
try{
const response=await fetch(url,{signal:controller.signal});
if(!response.ok){
throw new Error(response.status===429?
t("Anfragelimit erreicht. Bitte später erneut versuchen.","Request limit reached. Please try later."):
"HTTP "+response.status);
}
return await response.json();
}finally{clearTimeout(timer)}
}

async function loadNames(language){
const key="wt-names-v1-"+language;
const cached=read(key,null);
if(cached?.data){
names[language]=cached.data;
if(Date.now()-cached.at<TTL)return;
}
try{
const data=await fetchJSON(
"https://raw.githubusercontent.com/Sgambe33/WT-Vehicle-Data-Extract/master/locales/"+
language+".json");
if(!data.vehicles)throw new Error("Names");
names[language]={vehicles:data.vehicles,weapons:data.weapons||{}};
write(key,{at:Date.now(),data:names[language]});
}catch{}
if(page!=="nations"&&page!=="info")renderCards();
}

async function fetchCountry(id){
if(pending[id])return pending[id];
pending[id]=(async()=>{
const cached=memory[id]||read("wt-country-v1-"+id,null);
if(cached?.items?.length&&Date.now()-cached.at<TTL){
memory[id]=cached;return cached;
}
const items=[];
let finished=false;
try{
for(let index=0;index<50;index++){
const batch=await fetchJSON(
API+"?country="+encodeURIComponent(id)+
"&limit=200&page="+index+
"&excludeKillstreak=true&excludeEventVehicles=true");
if(!Array.isArray(batch)||batch.some(v=>
typeof v.identifier!=="string"||v.country!==id)){
throw new Error(t("Unerwartetes Datenformat.","Unexpected data format."));
}
items.push(...batch.map(normalize));
if(country===id&&page==="catalog"){
document.getElementById("catalog-results").textContent=
t("Lade Fahrzeuge: ","Loading vehicles: ")+items.length;
}
if(batch.length<200){finished=true;break}
}
if(!finished)throw new Error(
t("Katalog zu groß; Laden abgebrochen.","Catalog too large; loading stopped."));
const result={
at:Date.now(),
items:[...new Map(items.map(v=>[v.id,v])).values()]
};
memory[id]=result;
write("wt-country-v1-"+id,result);
return result;
}catch(e){
if(cached?.items?.length){
memory[id]=cached;return {...cached,stale:true};
}
throw e;
}
})();
try{return await pending[id]}
finally{delete pending[id]}
}

async function openCountry(id){
if(!countries[id])return;
country=id;page="catalog";category="all";search="";rank="all";
shown=60;loading=true;error="";list=[];retrieved=0;
render();
try{
const data=await fetchCountry(id);
if(country!==id||page!=="catalog")return;
list=data.items;retrieved=data.at;
if(data.stale){
error=t(
"Quelle nicht erreichbar. Letzter gespeicherter Stand wird angezeigt.",
"Source unavailable. Showing last saved data.");
}
list.forEach(v=>{
if(favorites.has(v.id))snapshots[v.id]={...v,name:name(v)};
});
write("wt-snapshots",snapshots);
}catch(e){
if(country!==id||page!=="catalog")return;
error=t("Laden fehlgeschlagen: ","Loading failed: ")+e.message;
}finally{
if(country===id&&page==="catalog"){loading=false;renderCards()}
}
}

function render(){
document.documentElement.lang=lang;
const languageButton=document.getElementById("language");
languageButton.textContent=lang==="de"?"EN":"DE";
languageButton.setAttribute("aria-label",
t("Switch to English","Auf Deutsch wechseln"));

const pages=[
["nations","⚑",t("Nationen","Nations")],
["catalog","▦",t("Katalog","Catalog")],
["favorites","★",t("Favoriten","Favorites")],
["info","ⓘ","Info"]
];
document.getElementById("navigation").innerHTML=pages.map(([id,icon,title])=>`
<button data-view="${id}" ${page===id?'aria-current="page"':""}>
<span aria-hidden="true">${icon}</span>${title}
</button>`).join("");

document.getElementById("footer").textContent=t(
"Inoffizielles Fanprojekt · Daten: WT Vehicles API / Sgambe33",
"Unofficial fan project · Data: WT Vehicles API / Sgambe33");

document.getElementById("status").textContent=storageFailed?t(
"Browser-Speicher voll oder blockiert. Änderungen können beim Schließen verloren gehen.",
"Browser storage full or blocked. Changes may be lost when closing."):"";

if(page==="nations"){
root.innerHTML=`
<section class="hero">
<div class="eyebrow">MILITARY TACTICAL / NATIONS</div>
<h1>${t("Wähle deine Nation.","Choose your nation.")}</h1>
<p>${t(
"Danach siehst du die Fahrzeuge ihres Forschungsbaums, einschließlich Premium- und Eventfahrzeugen aus der Datenquelle.",
"Explore its research nation, including premium and event vehicles available in the data source.")}</p>
</section>
<h2>${t("Forschungsnationen","Research nations")}</h2>
<div class="grid">
${Object.keys(countries).map(id=>`
<button class="card nation-card" data-country="${id}">
<div class="symbol" aria-hidden="true">${countries[id][2]}</div>
<strong>${countryName(id)}</strong>
<span>${t("Fahrzeuge ansehen →","View vehicles →")}</span>
</button>`).join("")}
</div>`;
return;
}

if(page==="info"){
root.innerHTML=`
<h1>${t("Über den Katalog","About the catalog")}</h1>
<div class="notice">${t(
"Der Katalog lädt alle von der Community-Quelle zurückgegebenen Fahrzeuge pro Forschungsnation. Testfahrzeuge und bestimmte Sondermodi sind ausgeschlossen. Vollständigkeit und Aktualität hängen vom Anbieter ab. Keine offizielle Gaijin-API.",
"The catalog loads all vehicles returned by the community source for each research nation. Test vehicles and certain special modes are excluded. Coverage and freshness depend on the provider. Not an official Gaijin API.")}</div>
<div class="notice">${t(
"Geladene Länder und Namen werden für 24 Stunden gespeichert. Favoriten und Lineups bleiben lokal auf diesem Gerät. Fahrzeugfortschritt wird bei Anmeldung im Companion-Konto gespeichert und manuell eingetragen.",
"Loaded nations and names are cached for 24 hours. Favorites and lineups stay on this device. Vehicle progress is entered manually and saved in your Companion account when signed in.")}</div>
<p><a class="link"
href="https://github.com/Sgambe33/WarThunder-Vehicles-API"
target="_blank" rel="noopener noreferrer">
WT Vehicles API / Sgambe33 ↗</a></p>
<p><a class="link"
href="https://github.com/Sgambe33/WT-Vehicle-Data-Extract"
target="_blank" rel="noopener noreferrer">
${t("Namensdaten & Quelle (GPL-3.0) ↗","Name data & source (GPL-3.0) ↗")}
</a></p>`;
return;
}

function renderCards(){

(category==="all"||v.category===category)&&
(rank==="all"||String(v.rank)===rank)&&
(name(v)+" "+v.id).toLocaleLowerCase().replace(/[\s_-]+/g,"").includes(query)
).sort((a,b)=>(a.rank||0)-(b.rank||0)||name(a).localeCompare(name(b)));

loading&&page==="catalog"?
t("Katalog wird geladen …","Loading catalog …"):

new Date(retrieved).toLocaleString(lang==="de"?"de-DE":"en-GB"):"");

filtered.slice(0,shown).map(v=>`

${v.premium?" · PREMIUM":""}${v.event?" · EVENT":""}
</span>
<h3>${esc(name(v))}</h3>
<p>${t("Rang","Rank")} ${v.rank||"—"} · ${mode.toUpperCase()}</p>

target="_blank" rel="noopener noreferrer">Wiki ↗</a>
<button class="star" data-star="${esc(v.id)}"
aria-pressed="${favorites.has(v.id)}"
aria-label="${t("Favorit umschalten: ","Toggle favorite: ")+esc(name(v))}">

async function showDetails(id){
const request=++detailRequest;
const snapshot=list.find(v=>v.id===id)||snapshots[id]||{id};
let data=null;

function draw(message=""){
const v=data||snapshot;
const full=Boolean(data);
const air=full?classify(v.vehicle_type)==="air":snapshot.category==="air";
const rows=[
[t("Nation","Nation"),countryName(v.country||snapshot.country||"")],
[t("Rang","Rank"),full?v.era:v.rank],
["BR · "+(air?t("Luft","Air"):t("Boden/Flotte","Ground/Fleet"))+" · AB",
formatBR(full?v.arcade_br:v.ab)],
["BR · RB",formatBR(full?v.realistic_br:v.rb)],
["BR · SB",formatBR(full?v.simulator_br:v.sb)]
];

const groundRB=full?v.realistic_ground_br:v.grb;
const groundSB=full?v.simulator_ground_br:v.gsb;
if(air&&groundRB!==(full?v.realistic_br:v.rb)){
rows.push(["BR · "+t("Boden-RB","Ground RB"),formatBR(groundRB)]);
}
if(air&&groundSB!==(full?v.simulator_br:v.sb)){
rows.push(["BR · "+t("Boden-SB","Ground SB"),formatBR(groundSB)]);
}
const crew=full?v.crew_total_count:v.crew;
if(crew)rows.push([t("Besatzung","Crew"),crew]);

for(const[key,title]of[
["hull_armor",t("Wanne F/S/H","Hull F/S/R")],
["turret_armor",t("Turm F/S/H","Turret F/S/R")]
]){
const value=full?v[key]:v[key==="hull_armor"?"hull":"turret"];
if(Array.isArray(value)&&value.length){
rows.push([title,value.join(" / ")+" mm"]);
}
}
if(full){
if(v.mass)rows.push([
t("Masse","Mass"),
(v.mass/1000).toLocaleString(lang==="de"?"de-DE":"en-GB")+" t"
]);
for(const[key,title]of[
["max_speed_ab","AB"],["max_speed_rb_sb","RB/SB"]
]){
if(typeof v.engine?.[key]==="number"){
rows.push([t("Geschwindigkeit · ","Speed · ")+title,v.engine[key]+" km/h"]);
}
}
if(Array.isArray(v.weapons)){
v.weapons.forEach(weapon=>{
const key=weapon.name.toLowerCase();
rows.push([
t("Bewaffnung","Armament"),
(weapon.count||1)+" × "+
(names[lang]?.weapons?.[key]||names.en?.weapons?.[key]||weapon.name)
]);
});
}
rows.push([t("Datenversion","Data version"),v.version||"—"]);
}

<h2 id="detail-title">${esc(name(snapshot))}</h2>

}
document.getElementById("status").textContent=storageFailed?
t("Speichern auf diesem Gerät nicht möglich.","Saving on this device is unavailable."):"";
});

render();
loadNames("en");
if(lang!=="en")loadNames(lang);
})();
</script>

<script>
(()=>{
if(window.wtVehicleCompare)return;
window.wtVehicleCompare=true;
const root=document.getElementById("content");
if(!root)return;

const t=(de,en)=>document.documentElement.lang==="en"?en:de;
const esc=escapeHTML;
function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))??fallback}
catch{return fallback}
}

let selected=read("wt-compare-selection",[]);

</div>`;

async function loadDetails(v){
const key="wt-detail-v1-"+v.id;
const cached=read(key,null);
if(cached?.data?.identifier===v.id&&Date.now()-cached.at<86400000){
return{data:cached.data};
}
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),25000);
try{
const response=await fetch(
"https://wtvehiclesapi.duckdns.org/api/vehicles/"+encodeURIComponent(v.id),
{signal:controller.signal});
if(!response.ok)throw new Error("HTTP "+response.status);
const data=await response.json();
if(data.identifier!==v.id)throw new Error("Data");
try{localStorage.setItem(key,JSON.stringify({at:Date.now(),data}))}catch{}
return{data};
}catch{
if(cached?.data?.identifier===v.id){
return{data:cached.data,unavailable:true};
}
let snapshot=read("wt-snapshots",{})?.[v.id];
if(!snapshot){
for(const country of Object.keys(countries)){
snapshot=read("wt-country-v1-"+country,null)?.items?.find(item=>item.id===v.id);
if(snapshot)break;
}
}
snapshot=snapshot||{id:v.id};
return{
data:{
country:snapshot.country,era:snapshot.rank,
arcade_br:snapshot.ab,realistic_br:snapshot.rb,
simulator_br:snapshot.sb,crew_total_count:snapshot.crew,
hull_armor:snapshot.hull,turret_armor:snapshot.turret
},
unavailable:true
};
}finally{clearTimeout(timer)}
}

async function openComparison(){
if(selected.length!==2)return;
const selection=selected.map(v=>({...v}));
const request=++requestId;
dialog.innerHTML=`
<button data-compare-close>${t("Schließen","Close")} ✕</button>
<h2 id="wt-compare-title">${t("Fahrzeugvergleich","Vehicle comparison")}</h2>
<p role="status">${t("Details werden geladen …","Loading details …")}</p>`;
dialog.showModal();
const results=await Promise.all(selection.map(loadDetails));
if(request!==requestId||!dialog.open)return;
const data=results.map(r=>r.data);
const number=value=>typeof value==="number"&&Number.isFinite(value)?
value.toLocaleString(document.documentElement.lang==="en"?"en-GB":"de-DE"):"—";
const br=value=>typeof value==="number"&&Number.isFinite(value)?value.toFixed(1):"—";
const armor=value=>Array.isArray(value)&&value.length?value.join(" / ")+" mm":"—";
const rows=[
[t("Nation","Nation"),v=>countries[v.country]?t(...countries[v.country]):v.country||"—"],
[t("Fahrzeugtyp (Quelle)","Vehicle type (source)"),v=>v.vehicle_type||"—"],
[t("Rang","Rank"),v=>number(v.era)],
["BR · AB",v=>br(v.arcade_br)],
["BR · RB",v=>br(v.realistic_br)],
["BR · SB",v=>br(v.simulator_br)],
[t("Boden-BR · RB","Ground BR · RB"),v=>br(v.realistic_ground_br)],
[t("Boden-BR · SB","Ground BR · SB"),v=>br(v.simulator_ground_br)],
[t("Besatzung","Crew"),v=>number(v.crew_total_count)],
[t("Masse","Mass"),v=>typeof v.mass==="number"?number(v.mass/1000)+" t":"—"],
[t("Geschwindigkeit · AB","Speed · AB"),v=>
typeof v.engine?.max_speed_ab==="number"?number(v.engine.max_speed_ab)+" km/h":"—"],
[t("Geschwindigkeit · RB/SB","Speed · RB/SB"),v=>
typeof v.engine?.max_speed_rb_sb==="number"?number(v.engine.max_speed_rb_sb)+" km/h":"—"],
[t("Wanne F/S/H","Hull F/S/R"),v=>armor(v.hull_armor)],
[t("Turm F/S/H","Turret F/S/R"),v=>armor(v.turret_armor)],
[t("Bewaffnung","Armament"),v=>{
const language=document.documentElement.lang==="en"?"en":"de";
const names=read("wt-names-v1-"+language,null)?.data?.weapons||{};
return Array.isArray(v.weapons)&&v.weapons.length?
v.weapons.map(w=>(w.count||1)+" × "+
(names[String(w.name).toLowerCase()]||w.name||"—")).join("; "):"—";
}],
[t("Datenversion","Data version"),v=>v.version||"—"]
];
dialog.innerHTML=`
<button data-compare-close>${t("Schließen","Close")} ✕</button>
<h2 id="wt-compare-title">${t("Fahrzeugvergleich","Vehicle comparison")}</h2>
<div class="wt-compare-scroll" tabindex="0" role="region"
aria-label="${t("Vergleichstabelle, seitlich scrollbar","Comparison table, scroll horizontally")}">
<table><thead><tr>
<th scope="col">${t("Merkmal","Attribute")}</th>
${selection.map(v=>`<th scope="col">${esc(name(v))}</th>`).join("")}
</tr></thead><tbody>
${rows.map(([title,getValue])=>`
<tr><th scope="row">${esc(title)}</th>
${data.map(v=>`<td>${esc(getValue(v))}</td>`).join("")}
</tr>`).join("")}
</tbody></table>
</div>
<p class="wt-compare-message" role="status">
${results.some(r=>r.unavailable)?t(
"Detailquelle teilweise nicht erreichbar. Gespeicherte Werte werden verwendet. ",
"Detail source partially unavailable. Using saved values. "):""}
${t(
"Community-Daten. — bedeutet: kein Wert vorhanden. Fahrzeugtyp, Spielmodus und Ausbau beim Vergleich beachten.",
"Community data. — means no value is available. Consider vehicle type, game mode and modifications.")}
</p>`;
}

<script>
(()=>{
if(window.wtLineupPlanner)return;
window.wtLineupPlanner=true;
const root=document.getElementById("content");
const navigation=document.getElementById("navigation");
if(!root||!navigation)return;
const t=(de,en)=>document.documentElement.lang==="en"?en:de;
const esc=escapeHTML;
function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))??fallback}
catch{return fallback}
}
function write(key,value){
try{localStorage.setItem(key,JSON.stringify(value));return true}
catch{return false}
}
const countries=["germany","usa","britain","ussr","france","italy","japan","china","sweden","israel"];
const countryNames={
germany:["Deutschland","Germany"],usa:["USA","USA"],
britain:["Großbritannien","Great Britain"],ussr:["UdSSR","USSR"],
france:["Frankreich","France"],italy:["Italien","Italy"],
japan:["Japan","Japan"],china:["China","China"],
sweden:["Schweden","Sweden"],israel:["Israel","Israel"]
};
function normalize(value){
if(!value||typeof value!=="object")value={};
let vehicles=Array.isArray(value.vehicles)?value.vehicles.filter(v=>
v&&typeof v.id==="string"&&countries.includes(v.country)):[];
const country=vehicles[0]?.country;
vehicles=[...new Map(vehicles.filter(v=>v.country===country).map(v=>[v.id,v])).values()];
return{
id:typeof value.id==="string"?value.id:"",
name:typeof value.name==="string"?value.name:"",
mode:["ab","rb","sb"].includes(value.mode)?value.mode:"rb",
battle:value.battle==="ground"?"ground":"standard",
vehicles
};
}
let draft=normalize(read("wt-lineup-draft-v1",{}));
let saved=read("wt-lineups-v1",[]);
saved=Array.isArray(saved)?saved.map(normalize).filter(v=>v.id&&v.name):[];
let message="";
const dialog=document.createElement("dialog");

<!-- BR-FILTER -->
<script>
(()=>{
if(window.wtBRControls)return;
window.wtBRControls=true;
const root=document.getElementById("content");
if(!root)return;
const t=(de,en)=>document.documentElement.lang==="en"?en:de;
function read(key,fallback){
try{return JSON.parse(localStorage.getItem(key))??fallback}
catch{return fallback}
}
const saved=read("wt-br-range-v1",{});
const valid=value=>typeof value==="number"&&Number.isFinite(value)&&value>=0;
let minimum=valid(saved?.minimum)?saved.minimum:null;
let maximum=valid(saved?.maximum)?saved.maximum:null;
if(minimum!==null&&maximum!==null&&minimum>maximum)maximum=minimum;

window.wtBRFilter=(vehicle,mode)=>{
if(minimum===null&&maximum===null)return true;
const value=vehicle[mode];
return valid(value)&&
(minimum===null||value>=minimum)&&
(maximum===null||value<=maximum);
};
function apply(){
try{localStorage.setItem("wt-br-range-v1",JSON.stringify({minimum,maximum}))}catch{}
refresh();
root.querySelector("#catalog-search")?.dispatchEvent(
new Event("input",{bubbles:true}));
}
let lastMarkup="";
function refresh(){
const filters=root.querySelector(".catalog-filters");
if(!filters)return;
let controls=filters.querySelector(".wt-br-controls");
if(!controls){
controls=document.createElement("div");
controls.className="wt-br-controls";
filters.append(controls);lastMarkup="";
}
const mode=root.querySelector("#choose-mode")?.value||"rb";
const values=[];
for(const country of[
"germany","usa","britain","ussr","france","italy","japan","china","sweden","israel"
]){
const data=read("wt-country-v1-"+country,null);
if(Array.isArray(data?.items)){
data.items.forEach(v=>{if(valid(v[mode]))values.push(v[mode])});
}
}
const snapshots=read("wt-snapshots",{});
if(snapshots&&typeof snapshots==="object"){
Object.values(snapshots).forEach(v=>{
if(v&&valid(v[mode]))values.push(v[mode]);
});
}
if(minimum!==null)values.push(minimum);
if(maximum!==null)values.push(maximum);
const ratings=[...new Set(values)].sort((a,b)=>a-b);
const options=selected=>
`<option value="all">${t("Beliebig","Any")}</option>`+
ratings.map(value=>`<option value="${value}"
${selected===value?"selected":""}>${value.toFixed(1)}</option>`).join("");
const markup=`
<label>${t("BR-Minimum","Minimum BR")}
<select id="wt-br-minimum" aria-label="${t("BR-Minimum","Minimum BR")}">
${options(minimum)}</select></label>
<label>${t("BR-Maximum","Maximum BR")}
<select id="wt-br-maximum" aria-label="${t("BR-Maximum","Maximum BR")}">
${options(maximum)}</select></label>
<p class="wt-br-note">${t(
"Filter für den gewählten Spielmodus. Bei aktivem BR-Filter werden Fahrzeuge ohne BR-Wert ausgeblendet.",
"Filter for the selected game mode. Vehicles without a BR value are hidden when a BR filter is active.")}</p>
<button class="wt-br-reset" id="wt-br-reset">
${t("BR-Filter zurücksetzen","Reset BR filter")}</button>`;
if(markup===lastMarkup)return;
lastMarkup=markup;controls.innerHTML=markup;

controls.querySelector("#wt-br-minimum").addEventListener("change",event=>{
minimum=event.target.value==="all"?null:Number(event.target.value);
if(minimum!==null&&maximum!==null&&minimum>maximum)maximum=minimum;
apply();
});
controls.querySelector("#wt-br-maximum").addEventListener("change",event=>{
maximum=event.target.value==="all"?null:Number(event.target.value);
if(maximum!==null&&minimum!==null&&maximum<minimum)minimum=maximum;
apply();
});
controls.querySelector("#wt-br-reset").addEventListener("click",()=>{
minimum=null;maximum=null;apply();
});
}
new MutationObserver(refresh).observe(root,{childList:true,subtree:true});
new MutationObserver(refresh).observe(document.documentElement,{
attributes:true,attributeFilter:["lang"]
});
refresh();
})();
</script>

notice.setAttribute("role","status");

let failed=false;
function refresh(){
const english=document.documentElement.lang==="en";
notice.hidden=navigator.onLine&&!failed;
notice.textContent=navigator.onLine?
failed?
english?
"Offline setup failed. Check that sw.js, the manifest and all three PNG icons are uploaded.":
"Offline-Einrichtung fehlgeschlagen. Prüfe, ob sw.js, das Manifest und alle drei PNG-Symbole hochgeladen sind.":

}

new MutationObserver(refresh).observe(document.documentElement,{
attributes:true,attributeFilter:["lang"]
});
refresh();
if("serviceWorker"in navigator&&location.protocol==="https:"){
navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(registration=>{
function watch(worker){
if(!worker)return;
worker.addEventListener("statechange",()=>{
if(worker.state==="redundant"&&!registration.active){
failed=true;refresh();
}
});
}
watch(registration.installing);
registration.addEventListener("updatefound",()=>watch(registration.installing));
}).catch(()=>{failed=true;refresh()});
}
})();
</script>

</button>
</div>`}

<p id="wt-account-message" role="status">${esc(message)}</p>
<p class="notice">${t(
"Du markierst deinen Fortschritt selbst. Es gibt keine automatische Übernahme aus War Thunder. Fahrzeugfortschritt wird in deinem Companion-Konto gespeichert; Favoriten und Lineups bleiben vorerst auf diesem Gerät.",
"You mark your progress yourself. There is no automatic import from War Thunder. Vehicle progress is saved in your Companion account; favorites and lineups currently stay on this device.")}</p>`;

const form=dialog.querySelector("#wt-account-form");
if(form){
form.addEventListener("submit",event=>{
event.preventDefault();
authenticate(event.submitter?.value||"login");
});
}
}

function openAccount(){
renderAccount();
if(!dialog.open)dialog.showModal();
}

async function loadProgress(){
if(!client||!user||saving.size)return;
const owner=user.id,version=epoch,request=++loadId;
loading=true;loadError="";
refresh();
if(dialog.open)renderAccount();

try{
const result=[];
for(let start=0;;start+=500){
const {data,error}=await client.from("vehicle_progress")
.select("vehicle_id,nation,status")
.eq("user_id",owner)
.order("vehicle_id")
.range(start,start+499);

if(error)throw error;
if(!Array.isArray(data))throw new Error("Unexpected progress data");
result.push(...data);
if(data.length<500)break;
}

if(epoch!==version||loadId!==request)return;

rows=new Map(
result.filter(r=>countries[r.nation]&&states[r.status])
.map(r=>[r.vehicle_id,r]));
loaded=true;
}catch(error){
if(epoch!==version||loadId!==request)return;
loaded=false;
loadError=t(
"Fortschritt konnte nicht geladen werden: ",
"Progress could not be loaded: ")+errorText(error);
}finally{
if(epoch===version&&loadId===request){
loading=false;
refresh();
if(dialog.open)renderAccount();
}
}
}

function sessionChanged(event,session){
const next=session?.user||null;
const changed=next?.id!==user?.id;

if(changed){
epoch++;loadId++;
rows=new Map();
saving.clear();
loading=false;loaded=false;loadError="";
}

user=next;

if(event==="PASSWORD_RECOVERY"){
recovery=true;message="";openAccount();
}
if(!user)recovery=false;

refresh();
if(dialog.open)renderAccount();

if(user&&(changed||!loaded)&&!loading){
setTimeout(()=>loadProgress(),0);
}
}

async function authenticate(action){
if(busy||!client)return;

const email=dialog.querySelector("#wt-account-email")?.value.trim();
const password=dialog.querySelector("#wt-account-password")?.value||"";

if(
(action==="register"||action==="update")&&password.length<8
){
setMessage(t(
"Bitte mindestens 8 Zeichen verwenden.",
"Please use at least 8 characters."));
return;
}

busy=true;
setMessage(t("Bitte warten …","Please wait …"));
dialog.querySelectorAll('button[type="submit"]')
.forEach(b=>b.disabled=true);

try{
const response=action==="register"?
await client.auth.signUp({
email,password,options:{emailRedirectTo:redirect}
}):
action==="update"?
await client.auth.updateUser({password}):
await client.auth.signInWithPassword({email,password});

if(response.error)throw response.error;

if(action==="update"){
recovery=false;
message=t("Passwort gespeichert.","Password saved.");
}else if(action==="register"&&!response.data?.session){
message=t(
"Falls die Registrierung möglich ist, erhältst du eine Bestätigungs-E-Mail. Öffne ihren Link und melde dich anschließend an.",
"If registration is available, you will receive a confirmation email. Open its link and then sign in.");
}else{
message=t("Angemeldet.","Signed in.");
}
}catch(error){
message=errorText(error);
}finally{
busy=false;renderAccount();
}
}

async function emailAction(action){
if(busy||!client)return;
const input=dialog.querySelector("#wt-account-email");
if(!input?.reportValidity())return;
busy=true;
setMessage(t("Bitte warten …","Please wait …"));
try{
const response=action==="reset"?
await client.auth.resetPasswordForEmail(
input.value.trim(),{redirectTo:redirect}):
await client.auth.resend({
type:"signup",
email:input.value.trim(),
options:{emailRedirectTo:redirect}
});
if(response.error)throw response.error;
message=t(
"Wenn ein passendes Konto vorhanden ist und der Mailversand eingerichtet ist, erhältst du eine E-Mail.",
"If a matching account exists and email delivery is configured, you will receive an email.");
}catch(error){
message=errorText(error);
}finally{
busy=false;renderAccount();
}
}

document.addEventListener("click",event=>{
const target=event.target.closest(
"[data-account-open],[data-account-close],[data-account-logout],"+
"[data-progress-reload],[data-account-reset],[data-account-resend]");
if(!target||target.disabled)return;

if(target.hasAttribute("data-account-open")){
openAccount();return;
}
if(target.hasAttribute("data-account-close")){
dialog.close();return;
}
if(target.hasAttribute("data-progress-reload")){
loadProgress();return;
}
if(target.hasAttribute("data-account-reset")){
emailAction("reset");return;
}
if(target.hasAttribute("data-account-resend")){
emailAction("resend");return;
}
if(target.hasAttribute("data-account-logout")){
if(busy||!client)return;
busy=true;
client.auth.signOut({scope:"local"})
.then(({error})=>{
message=error?
errorText(error):
t("Abgemeldet.","Signed out.");
})
.catch(error=>{message=errorText(error)})
.finally(()=>{busy=false;renderAccount()});
}
});

document.addEventListener("change",async event=>{
const select=event.target.closest("[data-vehicle-progress]");
if(!select||!client||!user||!loaded||loading)return;

const id=select.dataset.vehicleProgress;
const status=select.value;
const vehicle=findVehicle(id);

if(
saving.has(id)||!states[status]||
!countries[vehicle?.country]
)return;

const owner=user.id,version=epoch;
saving.add(id);
refresh();

try{
const {data,error}=await client.from("vehicle_progress")
.upsert({
user_id:owner,
vehicle_id:id,
nation:vehicle.country,
status,
updated_at:new Date().toISOString()
},{onConflict:"user_id,vehicle_id"})
.select("vehicle_id,nation,status")
.single();

if(error)throw error;
if(!data||data.vehicle_id!==id){
throw new Error("Save was not confirmed");
}
if(version!==epoch)return;

rows.set(id,data);
message=t("Fortschritt gespeichert.","Progress saved.");
}catch(error){
if(version!==epoch)return;
message=t("Speichern fehlgeschlagen: ","Saving failed: ")+errorText(error);
openAccount();
}finally{
if(version===epoch){
saving.delete(id);
refresh();
if(dialog.open)renderAccount();
}
}
});

new MutationObserver(refresh).observe(root,{
childList:true,subtree:true
});
new MutationObserver(()=>{
refresh();
if(dialog.open)renderAccount();
}).observe(document.documentElement,{
attributes:true,attributeFilter:["lang"]
});

refresh();

if(!window.supabase?.createClient){
message=t(
"Login-Bibliothek konnte nicht geladen werden. Prüfe deine Internetverbindung und lade die Seite neu.",
"The login library could not be loaded. Check your internet connection and reload.");
return;
}

try{
client=window.supabase.createClient(url,key,{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
});
client.auth.onAuthStateChange((event,session)=>{
sessionChanged(event,session);
});
}catch(error){
message=errorText(error);
}
})();
</script>

</body>
</html>
